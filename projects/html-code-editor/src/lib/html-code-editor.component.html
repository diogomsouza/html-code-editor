<div #editorWrapper class="html-code-editor" [class.resizing]="resizing" [class.expanded]="expanded" [class.source-hidden]="!showSource" [style.--editor-width]="editorWidth + '%'" (blur)="touch()">
  <div class="preview-panel">
    <div class="preview-toolbar">
      <div class="toolbar-block-format-group">
        <button
          type="button"
          class="toolbar-select toolbar-select-block"
          [disabled]="disabled"
          title="Formato do texto"
          (mousedown)="$event.preventDefault()"
          (click)="toggleBlockFormatPicker($event)"
        >
          <span>{{ getSelectedBlockFormatLabel() }}</span>
          <stagyra-html-code-editor-icon name="arrow_drop_down"></stagyra-html-code-editor-icon>
        </button>

        <div class="toolbar-block-format-popover" *ngIf="blockFormatPickerOpen" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()">
          <button
            type="button"
            class="block-format-option"
            *ngFor="let format of blockFormats"
            [class.selected]="format.value === selectedBlockFormat"
            [ngClass]="format.className"
            (mousedown)="$event.preventDefault()"
            (click)="applyBlockFormat(format.value)"
          >
            {{ format.label }}
          </button>
        </div>
      </div>

      <select class="toolbar-select" [disabled]="disabled" (change)="applyFont($any($event.target).value)">
        <option *ngFor="let font of fonts" [value]="font">{{ font }}</option>
      </select>

      <select class="toolbar-select toolbar-select-small" [disabled]="disabled" (change)="applyFontSize($any($event.target).value)">
        <option *ngFor="let size of fontSizes" [value]="size.value">{{ size.label }}</option>
      </select>

      <span class="toolbar-separator"></span>

      <button type="button" class="toolbar-button toolbar-button-bold" [disabled]="disabled" title="Negrito" (mousedown)="$event.preventDefault()" (click)="executePreviewCommand('bold')">B</button>
      <button type="button" class="toolbar-button toolbar-button-italic" [disabled]="disabled" title="Italico" (mousedown)="$event.preventDefault()" (click)="executePreviewCommand('italic')">
        I
      </button>
      <button type="button" class="toolbar-button toolbar-button-underline" [disabled]="disabled" title="Sublinhado" (mousedown)="$event.preventDefault()" (click)="executePreviewCommand('underline')">
        U
      </button>
      <button type="button" class="toolbar-button toolbar-button-strike" [disabled]="disabled" title="Riscado" (mousedown)="$event.preventDefault()" (click)="applyStrikethrough()">S</button>

      <span class="toolbar-separator"></span>

      <div class="toolbar-align-group">
        <button type="button" class="toolbar-button toolbar-icon-button" [disabled]="disabled" title="Alinhar texto" (mousedown)="$event.preventDefault()" (click)="toggleAlignmentPicker($event)">
          <stagyra-html-code-editor-icon [name]="selectedAlignmentIcon"></stagyra-html-code-editor-icon>
        </button>

        <div class="toolbar-align-popover" *ngIf="alignmentPickerOpen" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()">
          <button
            type="button"
            class="toolbar-button toolbar-icon-button"
            title="Alinhar a esquerda"
            (mousedown)="$event.preventDefault()"
            (click)="applyAlignment('justifyLeft', 'format_align_left')"
          >
            <stagyra-html-code-editor-icon name="format_align_left"></stagyra-html-code-editor-icon>
          </button>
          <button type="button" class="toolbar-button toolbar-icon-button" title="Centralizar" (mousedown)="$event.preventDefault()" (click)="applyAlignment('justifyCenter', 'format_align_center')">
            <stagyra-html-code-editor-icon name="format_align_center"></stagyra-html-code-editor-icon>
          </button>
          <button
            type="button"
            class="toolbar-button toolbar-icon-button"
            title="Alinhar a direita"
            (mousedown)="$event.preventDefault()"
            (click)="applyAlignment('justifyRight', 'format_align_right')"
          >
            <stagyra-html-code-editor-icon name="format_align_right"></stagyra-html-code-editor-icon>
          </button>
          <button type="button" class="toolbar-button toolbar-icon-button" title="Justificar" (mousedown)="$event.preventDefault()" (click)="applyAlignment('justifyFull', 'format_align_justify')">
            <stagyra-html-code-editor-icon name="format_align_justify"></stagyra-html-code-editor-icon>
          </button>
        </div>
      </div>

      <button type="button" class="toolbar-button toolbar-icon-button" [disabled]="disabled" title="Diminuir recuo" (mousedown)="$event.preventDefault()" (click)="executePreviewCommand('outdent')">
        <stagyra-html-code-editor-icon name="format_indent_decrease"></stagyra-html-code-editor-icon>
      </button>
      <button type="button" class="toolbar-button toolbar-icon-button" [disabled]="disabled" title="Aumentar recuo" (mousedown)="$event.preventDefault()" (click)="executePreviewCommand('indent')">
        <stagyra-html-code-editor-icon name="format_indent_increase"></stagyra-html-code-editor-icon>
      </button>

      <button
        type="button"
        class="toolbar-button toolbar-icon-button"
        [disabled]="disabled"
        title="Lista com marcadores"
        (mousedown)="$event.preventDefault()"
        (click)="executePreviewCommand('insertUnorderedList')"
      >
        <stagyra-html-code-editor-icon name="format_list_bulleted"></stagyra-html-code-editor-icon>
      </button>
      <button
        type="button"
        class="toolbar-button toolbar-icon-button"
        [disabled]="disabled"
        title="Lista numerada"
        (mousedown)="$event.preventDefault()"
        (click)="executePreviewCommand('insertOrderedList')"
      >
        <stagyra-html-code-editor-icon name="format_list_numbered"></stagyra-html-code-editor-icon>
      </button>

      <span class="toolbar-separator"></span>

      <div class="toolbar-color-group">
        <button
          type="button"
          class="toolbar-button toolbar-icon-button toolbar-color-button"
          [disabled]="disabled"
          title="Selecionar cor do texto"
          (mousedown)="$event.preventDefault()"
          (click)="toggleTextColorPicker($event)"
        >
          <stagyra-html-code-editor-icon name="format_color_text"></stagyra-html-code-editor-icon>
          <span class="toolbar-color-mark" [style.background-color]="selectedTextColor"></span>
        </button>

        <div class="toolbar-color-popover" *ngIf="colorPickerOpen" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()" (pointerdown)="$event.stopPropagation()">
          <div
            class="color-picker-area"
            [style.background]="textColorAreaBackground"
            (pointerdown)="selectTextColorFromArea($event)"
            (pointermove)="updateTextColorAreaDrag($event)"
            (pointerup)="stopTextColorAreaDrag()"
            (pointercancel)="stopTextColorAreaDrag()"
          >
            <span class="color-picker-cursor" [style.left.%]="colorSaturation" [style.top.%]="100 - colorValue"></span>
          </div>

          <div class="color-picker-controls">
            <span class="color-picker-preview" [style.background-color]="draftTextColor"></span>
            <div
              class="color-picker-hue"
              [style.--draft-color]="draftTextColor"
              (pointerdown)="startHueDrag($event)"
              (pointermove)="updateHueDrag($event)"
              (pointerup)="stopHueDrag()"
              (pointercancel)="stopHueDrag()"
            >
              <span class="color-picker-hue-thumb" [style.left.%]="(colorHue / 360) * 100"></span>
            </div>
          </div>

          <div class="color-format-row" *ngIf="textColorFormat === 'hex'; else textColorRgbFields">
            <input type="text" [value]="textColorHexInput" (input)="updateTextColorHex($any($event.target).value)" />
            <select [value]="textColorFormat" (change)="updateTextColorFormat($any($event.target).value)">
              <option value="hex">Hex</option>
              <option value="rgb">RGB</option>
            </select>
          </div>
          <ng-template #textColorRgbFields>
            <div class="color-format-row color-format-row-rgb">
              <div class="color-picker-rgb color-picker-rgb-inline">
                <label>
                  <input type="number" min="0" max="255" [value]="textColorRgb.r" (input)="updateTextColorRgb('r', $any($event.target).value)" />
                  <span>R</span>
                </label>
                <label>
                  <input type="number" min="0" max="255" [value]="textColorRgb.g" (input)="updateTextColorRgb('g', $any($event.target).value)" />
                  <span>G</span>
                </label>
                <label>
                  <input type="number" min="0" max="255" [value]="textColorRgb.b" (input)="updateTextColorRgb('b', $any($event.target).value)" />
                  <span>B</span>
                </label>
              </div>
              <select [value]="textColorFormat" (change)="updateTextColorFormat($any($event.target).value)">
                <option value="hex">Hex</option>
                <option value="rgb">RGB</option>
              </select>
            </div>
          </ng-template>

          <button type="button" class="color-picker-apply" (mousedown)="$event.preventDefault()" (click)="applySelectedTextColor()">
            <stagyra-html-code-editor-icon name="check"></stagyra-html-code-editor-icon>
            Aplicar
          </button>
        </div>
      </div>

      <div class="toolbar-background-group">
        <button
          type="button"
          class="toolbar-button toolbar-icon-button toolbar-background-button"
          [disabled]="disabled"
          title="Fundo do texto"
          (mousedown)="$event.preventDefault()"
          (click)="toggleBackgroundStylePicker($event)"
        >
          <stagyra-html-code-editor-icon name="format_color_fill"></stagyra-html-code-editor-icon>
          <span class="toolbar-color-mark" [style.background-color]="selectedBackgroundColor"></span>
        </button>

        <div class="toolbar-background-popover" *ngIf="backgroundStylePickerOpen" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()" (pointerdown)="$event.stopPropagation()">
          <div class="background-preview" [style.background-color]="draftBackgroundColor">Texto</div>

          <div
            class="color-picker-area"
            [style.background]="backgroundColorAreaBackground"
            (pointerdown)="selectBackgroundColorFromArea($event)"
            (pointermove)="updateBackgroundColorAreaDrag($event)"
            (pointerup)="stopBackgroundColorAreaDrag()"
            (pointercancel)="stopBackgroundColorAreaDrag()"
          >
            <span class="color-picker-cursor" [style.left.%]="backgroundSaturation" [style.top.%]="100 - backgroundValue"></span>
          </div>

          <div class="color-picker-controls">
            <span class="color-picker-preview" [style.background-color]="draftBackgroundColor"></span>
            <div
              class="color-picker-hue"
              [style.--draft-color]="draftBackgroundColor"
              (pointerdown)="startBackgroundHueDrag($event)"
              (pointermove)="updateBackgroundHueDrag($event)"
              (pointerup)="stopBackgroundHueDrag()"
              (pointercancel)="stopBackgroundHueDrag()"
            >
              <span class="color-picker-hue-thumb" [style.left.%]="(backgroundHue / 360) * 100"></span>
            </div>
          </div>

          <div class="color-format-row" *ngIf="backgroundColorFormat === 'hex'; else backgroundColorRgbFields">
            <input type="text" [value]="backgroundColorHexInput" (input)="updateBackgroundColorHex($any($event.target).value)" />
            <select [value]="backgroundColorFormat" (change)="updateBackgroundColorFormat($any($event.target).value)">
              <option value="hex">Hex</option>
              <option value="rgb">RGB</option>
            </select>
          </div>
          <ng-template #backgroundColorRgbFields>
            <div class="color-format-row color-format-row-rgb">
              <div class="color-picker-rgb color-picker-rgb-inline">
                <label>
                  <input type="number" min="0" max="255" [value]="backgroundColorRgb.r" (input)="updateBackgroundColorRgb('r', $any($event.target).value)" />
                  <span>R</span>
                </label>
                <label>
                  <input type="number" min="0" max="255" [value]="backgroundColorRgb.g" (input)="updateBackgroundColorRgb('g', $any($event.target).value)" />
                  <span>G</span>
                </label>
                <label>
                  <input type="number" min="0" max="255" [value]="backgroundColorRgb.b" (input)="updateBackgroundColorRgb('b', $any($event.target).value)" />
                  <span>B</span>
                </label>
              </div>
              <select [value]="backgroundColorFormat" (change)="updateBackgroundColorFormat($any($event.target).value)">
                <option value="hex">Hex</option>
                <option value="rgb">RGB</option>
              </select>
            </div>
          </ng-template>

          <button type="button" class="background-apply" (mousedown)="$event.preventDefault()" (click)="applyBackgroundStyle()">
            <stagyra-html-code-editor-icon name="check"></stagyra-html-code-editor-icon>
            Aplicar
          </button>
        </div>
      </div>

      <div class="toolbar-spacing-group">
        <button
          type="button"
          class="toolbar-button toolbar-icon-button"
          [disabled]="disabled"
          title="Espacamento do texto"
          (mousedown)="$event.preventDefault()"
          (click)="toggleSpacingStylePicker($event)"
        >
          <stagyra-html-code-editor-icon name="format_line_spacing"></stagyra-html-code-editor-icon>
        </button>

        <div class="toolbar-spacing-popover" *ngIf="spacingStylePickerOpen" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()" (pointerdown)="$event.stopPropagation()">
          <div
            class="spacing-preview"
            [style.color]="spacingPreviewTextColor"
            [style.background-color]="spacingPreviewBackgroundColor"
            [style.padding.px]="backgroundPadding"
            [style.border-radius.px]="backgroundBorderRadius"
            [style.margin.px]="textMargin"
          >
            Texto
          </div>

          <div class="spacing-style-fields">
            <label>
              <span>Padding: {{ backgroundPadding }}px</span>
              <input type="range" min="0" max="40" [value]="backgroundPadding" (input)="updateBackgroundPadding($any($event.target).value)" />
            </label>
            <label>
              <span>Raio: {{ backgroundBorderRadius }}px</span>
              <input type="range" min="0" max="40" [value]="backgroundBorderRadius" (input)="updateBackgroundBorderRadius($any($event.target).value)" />
            </label>
            <label>
              <span>Margem: {{ textMargin }}px</span>
              <input type="range" min="0" max="80" [value]="textMargin" (input)="updateTextMargin($any($event.target).value)" />
            </label>
          </div>

          <button type="button" class="spacing-apply" (mousedown)="$event.preventDefault()" (click)="applySpacingStyle()">
            <stagyra-html-code-editor-icon name="check"></stagyra-html-code-editor-icon>
            Aplicar
          </button>
        </div>
      </div>

      <div class="toolbar-border-group">
        <button
          type="button"
          class="toolbar-button toolbar-icon-button toolbar-border-button"
          [disabled]="disabled"
          title="Borda"
          (mousedown)="$event.preventDefault()"
          (click)="toggleBorderStylePicker($event)"
        >
          <stagyra-html-code-editor-icon name="border_color"></stagyra-html-code-editor-icon>
          <span class="toolbar-color-mark" [style.background-color]="selectedBorderColor"></span>
        </button>

        <div class="toolbar-border-popover" *ngIf="borderStylePickerOpen" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()" (pointerdown)="$event.stopPropagation()">
          <div class="border-preview" [style.border]="borderWidth + 'px solid ' + draftBorderColor">Texto</div>

          <div
            class="color-picker-area"
            [style.background]="borderColorAreaBackground"
            (pointerdown)="selectBorderColorFromArea($event)"
            (pointermove)="updateBorderColorAreaDrag($event)"
            (pointerup)="stopBorderColorAreaDrag()"
            (pointercancel)="stopBorderColorAreaDrag()"
          >
            <span class="color-picker-cursor" [style.left.%]="borderSaturation" [style.top.%]="100 - borderValue"></span>
          </div>

          <div class="color-picker-controls">
            <span class="color-picker-preview" [style.background-color]="draftBorderColor"></span>
            <div
              class="color-picker-hue"
              [style.--draft-color]="draftBorderColor"
              (pointerdown)="startBorderHueDrag($event)"
              (pointermove)="updateBorderHueDrag($event)"
              (pointerup)="stopBorderHueDrag()"
              (pointercancel)="stopBorderHueDrag()"
            >
              <span class="color-picker-hue-thumb" [style.left.%]="(borderHue / 360) * 100"></span>
            </div>
          </div>

          <div class="color-format-row" *ngIf="borderColorFormat === 'hex'; else borderColorRgbFields">
            <input type="text" [value]="borderColorHexInput" (input)="updateBorderColorHex($any($event.target).value)" />
            <select [value]="borderColorFormat" (change)="updateBorderColorFormat($any($event.target).value)">
              <option value="hex">Hex</option>
              <option value="rgb">RGB</option>
            </select>
          </div>
          <ng-template #borderColorRgbFields>
            <div class="color-format-row color-format-row-rgb">
              <div class="color-picker-rgb color-picker-rgb-inline">
                <label>
                  <input type="number" min="0" max="255" [value]="borderColorRgb.r" (input)="updateBorderColorRgb('r', $any($event.target).value)" />
                  <span>R</span>
                </label>
                <label>
                  <input type="number" min="0" max="255" [value]="borderColorRgb.g" (input)="updateBorderColorRgb('g', $any($event.target).value)" />
                  <span>G</span>
                </label>
                <label>
                  <input type="number" min="0" max="255" [value]="borderColorRgb.b" (input)="updateBorderColorRgb('b', $any($event.target).value)" />
                  <span>B</span>
                </label>
              </div>
              <select [value]="borderColorFormat" (change)="updateBorderColorFormat($any($event.target).value)">
                <option value="hex">Hex</option>
                <option value="rgb">RGB</option>
              </select>
            </div>
          </ng-template>

          <label class="border-width-field">
            <span>Espessura: {{ borderWidth }}px</span>
            <input type="range" min="1" max="20" [value]="borderWidth" (input)="updateBorderWidth($any($event.target).value)" />
          </label>

          <button type="button" class="border-apply" (mousedown)="$event.preventDefault()" (click)="applyBorderStyle()">
            <stagyra-html-code-editor-icon name="check"></stagyra-html-code-editor-icon>
            Aplicar
          </button>
        </div>
      </div>

      <span class="toolbar-separator"></span>

      <div class="toolbar-link-group">
        <button type="button" class="toolbar-button toolbar-icon-button" [disabled]="disabled" title="Adicionar link" (mousedown)="$event.preventDefault()" (click)="toggleLinkPicker($event)">
          <stagyra-html-code-editor-icon name="link"></stagyra-html-code-editor-icon>
        </button>

        <div class="toolbar-link-popover" *ngIf="linkPickerOpen" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()" (pointerdown)="$event.stopPropagation()">
          <label class="link-field">
            <span>URL</span>
            <input type="text" [value]="linkUrl" placeholder="https://..." (input)="linkUrl = $any($event.target).value" (keydown.enter)="applyLink()" />
          </label>

          <button type="button" class="link-apply" (mousedown)="$event.preventDefault()" (click)="applyLink()">
            <stagyra-html-code-editor-icon name="check"></stagyra-html-code-editor-icon>
            Aplicar
          </button>
        </div>
      </div>

      <button type="button" class="toolbar-button toolbar-icon-button" [disabled]="disabled" title="Remover link" (mousedown)="$event.preventDefault()" (click)="removeLink()">
        <stagyra-html-code-editor-icon name="link_off"></stagyra-html-code-editor-icon>
      </button>

      <div class="toolbar-emoji-group">
        <button type="button" class="toolbar-button toolbar-icon-button" [disabled]="disabled" title="Inserir emoji" (mousedown)="$event.preventDefault()" (click)="toggleEmojiPicker($event)">
          <stagyra-html-code-editor-icon name="insert_emoticon"></stagyra-html-code-editor-icon>
        </button>

        <div class="toolbar-emoji-popover" *ngIf="emojiPickerOpen" (click)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()" (pointerdown)="$event.stopPropagation()">
          <button *ngFor="let emoji of emojis" type="button" class="emoji-option" [title]="emoji" (mousedown)="$event.preventDefault()" (click)="insertEmoji(emoji)">
            {{ emoji }}
          </button>
        </div>
      </div>

      <button type="button" class="toolbar-button toolbar-icon-button" [disabled]="disabled" title="Adicionar imagem" (mousedown)="$event.preventDefault()" (click)="imageInput.click()">
        <stagyra-html-code-editor-icon name="image"></stagyra-html-code-editor-icon>
      </button>
      <input #imageInput class="image-file-input" type="file" accept="image/*" (change)="insertImageFromInput($event)" />

      <span class="toolbar-separator"></span>

      <button type="button" class="toolbar-button toolbar-icon-button" [disabled]="disabled" title="Limpar formatacao" (mousedown)="$event.preventDefault()" (click)="clearSelectedFormatting()">
        <stagyra-html-code-editor-icon name="format_clear"></stagyra-html-code-editor-icon>
      </button>

      <span class="toolbar-spacer"></span>

      <button *ngIf="showSourceButton" type="button" class="toolbar-button toolbar-icon-button" [title]="showSource ? 'Ocultar codigo fonte' : 'Visualizar codigo fonte'" (click)="toggleSource()">
        <stagyra-html-code-editor-icon [name]="showSource ? 'visibility_off' : 'code'"></stagyra-html-code-editor-icon>
      </button>

      <button type="button" class="toolbar-button toolbar-icon-button" [title]="expanded ? 'Sair da tela cheia' : 'Expandir editor'" (click)="toggleExpanded()">
        <stagyra-html-code-editor-icon [name]="expanded ? 'close_fullscreen' : 'open_in_full'"></stagyra-html-code-editor-icon>
      </button>
    </div>

    <iframe #previewFrame class="preview-frame" sandbox="allow-same-origin" (load)="previewLoaded()"></iframe>
  </div>
  <div class="resize-divider" (pointerdown)="resizeStart($event)"></div>
  <div class="editor-panel">
    <div class="source-editor" [class.source-wrap]="sourceLineWrap">
      <div class="source-line-numbers" [style.transform]="'translateY(-' + codeScrollTop + 'px)'">
        <span *ngFor="let lineNumber of codeLineNumbers; trackBy: trackLineNumber">{{ lineNumber }}</span>
      </div>
      <div class="source-code-pane">
        <pre
          class="source-highlight"
          [style.transform]="'translate(' + -codeScrollLeft + 'px, ' + -codeScrollTop + 'px)'"
        ><code><span *ngFor="let line of highlightedSourceLines" [innerHTML]="line"></span></code></pre>
        <textarea
          #codeTextarea
          class="source-textarea"
          [value]="value"
          [disabled]="disabled"
          [attr.wrap]="sourceLineWrap ? 'soft' : 'off'"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          (input)="sourceInput($event)"
          (scroll)="sourceScroll($event)"
          (keydown)="sourceKeyDown($event)"
          (blur)="touch()"
        ></textarea>
      </div>
    </div>
  </div>
  <div class="resize-overlay" *ngIf="resizing" (pointerup)="resizeEnd()" (pointercancel)="resizeEnd()"></div>
</div>
